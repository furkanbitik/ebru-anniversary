name: Deploy

# main'e her push'ta site Cloudflare Workers'a yayınlanır.
# Gereken tek şey: CLOUDFLARE_API_TOKEN adlı repository secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Proje statik; derleme adımı yok.
      # wrangler.jsonc içindeki assets.directory (./public) yayınlanır.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fc823768e015582d7018af2527541a58
